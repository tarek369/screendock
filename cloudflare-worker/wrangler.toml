name = "screendock-legal"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Deploy to workers.dev first (free). Once you confirm cressu.com is on your
# Cloudflare account, uncomment for a clean custom domain on the free plan:
#
routes = [
  { pattern = "screendock.cressu.com", custom_domain = true }
]

# Landing page + media. The worker runs first (HTTPS redirect, /privacy) and
# hands every other request to these assets; unknown paths get 404.html.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true
